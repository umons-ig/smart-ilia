  <use href="#block" x="76" y="156"/><use href="#block" x="168" y="156"/><use href="#block" x="260" y="156"/>
  <g fill="none" stroke="#8B1538" stroke-width="1.5" stroke-dasharray="4 5">
    <path d="M60 56H336M60 141H336M60 226H336M60 56V226M152 56V226M244 56V226M336 56V226"/>
    <path d="M344 141h44"/>
  </g>
