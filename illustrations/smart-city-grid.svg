    <g id="sensor"><circle r="8" fill="#FFF" stroke="#8B1538" stroke-width="1.6"/><circle r="2.5" fill="#8B1538"/></g>
  </defs>
  <rect width="520" height="290" fill="#F6F8FA"/>
  <rect x="16" y="18" width="488" height="250" fill="url(#dots)"/>
